# uclaw-pi-engine — Engine Actor + ACL that drives the vendored pi (crates/pi)
# and translates pi AgentEvents into uClaw's frontend `chat:stream-*` contract.
#
# [R1] Standalone sub-workspace for now: it depends on crates/pi, which links
# libsqlite3-sys 0.37 — incompatible with uClaw's rusqlite until the F2
# data-layer migration removes rusqlite. Build/test standalone:
#   cargo build --manifest-path crates/uclaw-pi-engine/Cargo.toml
#   cargo test  --manifest-path crates/uclaw-pi-engine/Cargo.toml
# R1 promotes this (and crates/pi) into the main workspace once uClaw is off
# rusqlite. See docs/MIGRATION_GOALS.md §P0.
[workspace]

[package]
name = "uclaw-pi-engine"
version = "0.1.0"
edition = "2021"
description = "Engine Actor + ACL bridging the pi agent runtime to uClaw's Tauri event contract"
license = "Apache-2.0"

[dependencies]
pi = { package = "pi_agent_rust", path = "../pi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
