# uclaw-pi-engine — Engine Actor + ACL that drives the vendored pi (crates/pi)
# and translates pi AgentEvents into uClaw's frontend `chat:stream-*` contract.
#
# [R1] Standalone sub-workspace for now: it depends on crates/pi, which links
# libsqlite3-sys 0.37 — incompatible with uClaw's rusqlite until the F2
# data-layer migration removes rusqlite. Build/test standalone:
#   cargo build --manifest-path crates/uclaw-pi-engine/Cargo.toml
#   cargo test  --manifest-path crates/uclaw-pi-engine/Cargo.toml
# R1 promotes this (and crates/pi) into the main workspace once uClaw is off
# rusqlite. See docs/MIGRATION_GOALS.md §P0.
[package]
name = "uclaw-pi-engine"
version = "0.1.0"
edition = "2021"
description = "Engine Actor + ACL bridging the pi agent runtime to uClaw's Tauri event contract"
license = "Apache-2.0"

[dependencies]
# default-features = false: drop pi's terminal front-end (`tui`/`ftui`), which
# uClaw never uses. `bpe-tokens` keeps upstream's real BPE token counting for
# compaction thresholds (default-on upstream since v0.3.0). `sqlite-sessions`
# is required for pi's lib to compile (upstream doesn't gate every use); it is
# the pure-Rust fsqlite now, so no `links` clash with uClaw's rusqlite. pi still
# runs stateless (no_session) — uClaw owns persistence.
pi = { package = "pi_agent_rust", path = "../pi", default-features = false, features = ["bpe-tokens", "sqlite-sessions"] }
# Same runtime pi uses; the engine bootstraps a dedicated asupersync runtime on
# its own OS thread (never tokio). Must stay on the same minor as crates/pi
# (shared types); pi upstream 6e19cb50 uses 0.5.
asupersync = { version = "0.5.0", default-features = false, features = ["tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# [R4] Tool trait is #[async_trait]; wrapped uClaw tools impl it.
async-trait = "0.1"
